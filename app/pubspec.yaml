name: koeder
description: "KÖDER: daily security awareness training as a game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.1
  stomp_dart_client: ^3.0.1
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  audioplayers: ^6.6.0
  fl_chart: 0.71.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4
  intl: ^0.20.2
  uuid: ^4.6.0
  image_picker: ^1.2.1
  web: ^1.1.1
  # Generated from docs/openapi.json by scripts/gen_api.sh. Never edit by hand.
  koeder_api:
    path: packages/koeder_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  shaders:
    - shaders/glitch.frag
  assets:
    - assets/audio/
    - assets/content/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

