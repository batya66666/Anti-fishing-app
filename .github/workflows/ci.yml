name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit tests, Modulith boundary check, content validation, integration tests against real Postgres (Testcontainers).
      - run: mvn -B verify
        working-directory: backend

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: dart run tool/sync_content.dart
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter build web --release --no-web-resources-cdn -o build/web
        working-directory: app
      - run: flutter build web --release --no-web-resources-cdn -t lib/main_admin.dart --base-href /admin/ -o build/admin
        working-directory: app

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t koeder-backend .
